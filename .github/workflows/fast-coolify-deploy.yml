name: Fast Coolify Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ai-math-tutor-production
  cancel-in-progress: false

env:
  DOCKER_TAG: sha-${{ github.sha }}
  IMAGE_NAMESPACE: ghcr.io/maxpetrusenko

jobs:
  gates:
    name: Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm
        run: corepack enable

      - name: Install backend deps
        run: python3 -m pip install -e '.[dev]'

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile --dir frontend

      - name: Frontend tests
        run: pnpm test

      - name: Frontend typecheck
        run: pnpm typecheck

      - name: Frontend build
        run: pnpm build

      - name: Backend tests
        run: python3 -m pytest

  build-images:
    name: Build ${{ matrix.app }} image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    needs:
      - gates

    strategy:
      fail-fast: false
      matrix:
        include:
          - app: backend
            image: ai-math-tutor-backend
            dockerfile: backend/Dockerfile
            context: .
          - app: session
            image: ai-math-tutor-session
            dockerfile: backend/Dockerfile
            context: .
          - app: avatar-worker
            image: ai-math-tutor-avatar-worker
            dockerfile: backend/Dockerfile.worker
            context: .
          - app: frontend
            image: ai-math-tutor-frontend
            dockerfile: frontend/Dockerfile
            context: frontend
          - app: web
            image: ai-math-tutor-web
            dockerfile: frontend/Dockerfile
            context: frontend

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:${{ env.DOCKER_TAG }}
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  deploy:
    name: Deploy ${{ matrix.app }} to Coolify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip deploy]') }}
    needs:
      - build-images
    env:
      COOLIFY_SSH_PRIVATE_KEY: ${{ secrets.COOLIFY_SSH_PRIVATE_KEY }}
      COOLIFY_SSH_KNOWN_HOSTS: ${{ secrets.COOLIFY_SSH_KNOWN_HOSTS }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - app: session
            uuid: gx7frryikdt0o7uqtgumzi72
            image: ai-math-tutor-session
            port: "8080"
            health: /api/runtime-options
            health_enabled: "true"
          - app: web
            uuid: rx0jx3ghadj7r2uemnhsl9kt
            image: ai-math-tutor-web
            port: "3000"
            health: /api/runtime/status
            health_enabled: "true"
          - app: avatar-worker
            uuid: yw36ciy2dqqcq9ituuwzdsru
            image: ai-math-tutor-avatar-worker
            port: "8080"
            health: ""
            health_enabled: "false"

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Skip deploy when SSH secret is absent
        if: ${{ env.COOLIFY_SSH_PRIVATE_KEY == '' }}
        run: echo "::warning::COOLIFY_SSH_PRIVATE_KEY is not configured; gates and image builds passed, deploy skipped."

      - name: Point Coolify at image tag and deploy
        if: ${{ env.COOLIFY_SSH_PRIVATE_KEY != '' }}
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN || secrets.COOLIFY_TOKEN }}
          COOLIFY_SSH_HOST: ${{ secrets.COOLIFY_SSH_HOST || '173.249.52.27' }}
          COOLIFY_SSH_USER: ${{ secrets.COOLIFY_SSH_USER || 'root' }}
          COOLIFY_UUID: ${{ matrix.uuid }}
          COOLIFY_IMAGE: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          COOLIFY_PORT: ${{ matrix.port }}
          COOLIFY_HEALTH_PATH: ${{ matrix.health }}
          COOLIFY_HEALTH_ENABLED: ${{ matrix.health_enabled }}
        run: bash scripts/coolify_ssh_deploy.sh
