[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nerdy"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.135,<1.0",
  "langchain-core>=1.2,<2.0",
  "langchain-anthropic>=1.0,<2.0",
  "langchain-google-genai>=4.2,<5.0",
  "langchain-openai>=1.0,<2.0",
  "livekit-agents>=1.4,<2.0",
  "livekit-api>=1.1,<2.0",
  "livekit-plugins-liveavatar>=1.4,<2.0",
  "livekit-plugins-openai>=1.4,<2.0",
  "livekit-plugins-simli>=1.4,<2.0",
  "uvicorn>=0.35,<1.0",
  "websockets>=15,<16"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=1.0,<2.0",
  "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
  "B",     # flake8-bugbear — BLE001 = bare except (real bug)
  "F",     # pyflakes — undefined names, unused vars (real bugs)
  "S",     # flake8-bandit — security anti-patterns
]
ignore = [
  "S101",   # assert — used in test/benchmark files
  "S105",   # hardcoded password in test code
  "S110",   # try-except-pass — intentional LangSmith tracing suppressions
  "S310",   # audit URLs — intentional in realtime client
]


[tool.setuptools.packages.find]
include = ["backend*", "eval*"]
